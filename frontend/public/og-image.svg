  <rect x="100" y="440" width="60" height="4" rx="2" fill="url(#accent)" opacity="0.7"/>
  <text x="100" y="490" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.35)" letter-spacing="3">ORCID INTEGRATED  ·  MODERN  ·  SECURE</text>
