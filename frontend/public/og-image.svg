  <!-- Logo icon large -->
  <rect x="830" y="195" width="270" height="270" rx="50" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <rect x="893" y="258" width="144" height="20" rx="4" fill="white" opacity="0.9"/>
  <rect x="933" y="258" width="20" height="140" rx="4" fill="white" opacity="0.9"/>
  <rect x="933" y="378" width="107" height="20" rx="4" fill="url(#accent)" opacity="0.85"/>
  <circle cx="1047" cy="268" r="13" fill="#34d399"/>
  <!-- Text -->
  <text x="100" y="260" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-2">TruEditor</text>
  <text x="100" y="320" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="400" fill="rgba(255,255,255,0.6)">Next Generation Academic Publishing</text>
  <text x="100" y="370" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.4)">Manuscript Submission Made Simple</text>
